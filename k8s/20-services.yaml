# Os 7 microsservicos. Imagens construidas na Entrega 5 (tes2-*); imagePullPolicy IfNotPresent
# (num cluster real, publicar num registry). Env via ConfigMap/Secret; resolucao por DNS + lb://.
# ---------------- name-server (Eureka) ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: name-server, namespace: tes2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: name-server } }
  template:
    metadata: { labels: { app: name-server } }
    spec:
      containers:
        - name: name-server
          image: tes2-name-server
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8761 }]
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe: { tcpSocket: { port: 8761 }, initialDelaySeconds: 25, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 8761 }, initialDelaySeconds: 40, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: name-server, namespace: tes2 }
spec:
  selector: { app: name-server }
  ports: [{ port: 8761, targetPort: 8761 }]
# ---------------- llm-gateway ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: llm-gateway, namespace: tes2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: llm-gateway } }
  template:
    metadata: { labels: { app: llm-gateway } }
    spec:
      containers:
        - name: llm-gateway
          image: tes2-llm-gateway
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: platform-config }
          ports: [{ containerPort: 4000 }]
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { tcpSocket: { port: 4000 }, initialDelaySeconds: 15, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: llm-gateway, namespace: tes2 }
spec:
  selector: { app: llm-gateway }
  ports: [{ port: 4000, targetPort: 4000 }]
# ---------------- memory-service ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: memory-service, namespace: tes2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: memory-service } }
  template:
    metadata: { labels: { app: memory-service } }
    spec:
      containers:
        - name: memory-service
          image: tes2-memory-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secret }
          ports: [{ containerPort: 8082 }]
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8082 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8082 }, initialDelaySeconds: 60, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: memory-service, namespace: tes2 }
spec:
  selector: { app: memory-service }
  ports: [{ port: 8082, targetPort: 8082 }]
# ---------------- retrieval-service ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: retrieval-service, namespace: tes2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: retrieval-service } }
  template:
    metadata: { labels: { app: retrieval-service } }
    spec:
      containers:
        - name: retrieval-service
          image: tes2-retrieval-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - { name: SERVICE_HOST, value: retrieval-service }   # registrado no Eureka (DNS do K8s)
            - { name: OTEL_SERVICE_NAME, value: retrieval-service }
            - { name: OTEL_TRACES_EXPORTER, value: otlp }
            - { name: OTEL_METRICS_EXPORTER, value: none }
            - { name: OTEL_LOGS_EXPORTER, value: none }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://jaeger:4318 }
          ports: [{ containerPort: 8083 }]
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /health, port: 8083 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8083 }, initialDelaySeconds: 40, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: retrieval-service, namespace: tes2 }
spec:
  selector: { app: retrieval-service }
  ports: [{ port: 8083, targetPort: 8083 }]
# ---------------- tool-registry ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tool-registry, namespace: tes2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: tool-registry } }
  template:
    metadata: { labels: { app: tool-registry } }
    spec:
      containers:
        - name: tool-registry
          image: tes2-tool-registry
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secret }
          env:
            - { name: RETRIEVAL_URL, value: lb://retrieval-service }
          ports: [{ containerPort: 8084 }]
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8084 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8084 }, initialDelaySeconds: 60, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: tool-registry, namespace: tes2 }
spec:
  selector: { app: tool-registry }
  ports: [{ port: 8084, targetPort: 8084 }]
# ---------------- agent-service ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agent-service, namespace: tes2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: agent-service } }
  template:
    metadata: { labels: { app: agent-service } }
    spec:
      containers:
        - name: agent-service
          image: tes2-agent-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - { name: MEMORY_URL, value: lb://memory-service }
            - { name: RETRIEVAL_URL, value: lb://retrieval-service }
            - { name: TOOLS_URL, value: lb://tool-registry }
          ports: [{ containerPort: 8081 }]
          resources:
            requests: { cpu: "150m", memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 60, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: agent-service, namespace: tes2 }
spec:
  selector: { app: agent-service }
  ports: [{ port: 8081, targetPort: 8081 }]
