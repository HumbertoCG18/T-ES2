spring:
  application:
    name: tool-registry

  # Datasource read-only para a ferramenta db_query (Postgres da plataforma, db memory).
  # Sobrescrever via env em Docker/K8s. Hikari conecta sob demanda (nao falha no startup se o DB cair).
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/memory}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      read-only: true            # defesa extra: conexao read-only
      maximum-pool-size: 3
      minimum-idle: 0

# retrieval-service para a ferramenta knowledge_search (lb:// ou http://host:porta).
retrieval:
  base-url: ${RETRIEVAL_URL:lb://retrieval-service}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.tes2.toolregistry: INFO
