[project]
name = "retrieval-service"
version = "0.1.0"
description = "Busca semantica em documentos (RAG): ChromaDB + embeddings via llm-gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "chromadb>=1.5,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "py-eureka-client>=0.11",
    "aio-pika>=9.4",
]
