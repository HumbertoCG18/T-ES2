# Serve a SPA e faz proxy reverso de /api -> api-gateway.
# Espelha o vite.config.ts: a barra final em proxy_pass remove o prefixo /api
# (/api/chat -> gateway /chat), igual ao rewrite do dev server.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api-gateway:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streaming: pull de modelos (NDJSON) e LLM local lento (TimeLimiter 600s).
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Client-side routing: rota desconhecida cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
