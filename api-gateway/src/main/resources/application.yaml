spring:
  application:
    name: api-gateway

  # Redis para o rate limiter (token bucket) do gateway. Container de infra.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Busca o registro a cada 5s (default 30s) para o lb://agent-service resolver rapido
    # apos a subida — evita 503 inicial na demo.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
