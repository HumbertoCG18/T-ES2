# Plataforma de Agentes Conversacionais — orquestração completa (Entrega 5).
# Sobe os 7 microsserviços + infra (Redis, PostgreSQL, ChromaDB, RabbitMQ) + Ollama.
# Tudo na mesma rede do compose; serviços se resolvem por nome (e por lb:// via Eureka).
# 100% local, sem nuvem.
#
#   docker compose build              # constroi as 7 imagens (1a vez ~minutos)
#   docker compose up -d              # sobe tudo
#   docker compose exec ollama ollama pull llama3.1          # 1a vez (fica no volume)
#   docker compose exec ollama ollama pull embeddinggemma:300m
#   curl http://localhost:8080/chat -H "Content-Type: application/json" -d '{"message":"oi"}'

name: tes2

services:
  # ---------------- Infra ----------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memory"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:1.5.3
    container_name: chromadb
    ports: ["8000:8000"]
    volumes: ["chroma-data:/data"]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports: ["11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    restart: unless-stopped
    # GPU (opcional): descomente se tiver NVIDIA + nvidia-container-toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - { driver: nvidia, count: all, capabilities: [gpu] }

  # ---------------- Serviços ----------------
  name-server:
    build: ./name-server
    container_name: name-server
    ports: ["8761:8761"]
    restart: unless-stopped

  llm-gateway:
    build: ./llm-gateway
    container_name: llm-gateway
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports: ["4000:4000"]
    depends_on:
      - ollama
    restart: unless-stopped

  memory-service:
    build: ./memory-service
    container_name: memory-service
    environment:
      EUREKA_URL: http://name-server:8761/eureka
      POSTGRES_URL: jdbc:postgresql://postgres:5432/memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      name-server: { condition: service_started }
    restart: unless-stopped

  retrieval-service:
    build: ./retrieval-service
    container_name: retrieval-service
    environment:
      EUREKA_URL: http://name-server:8761/eureka
      LLM_BASE_URL: http://llm-gateway:4000
      CHROMA_HOST: chromadb
      RABBITMQ_HOST: rabbitmq
      SERVICE_HOST: retrieval-service   # registrado no Eureka; resolvido por DNS do compose
    ports: ["8083:8083"]
    depends_on:
      chromadb: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      llm-gateway: { condition: service_started }
      name-server: { condition: service_started }
    restart: unless-stopped

  tool-registry:
    build: ./tool-registry
    container_name: tool-registry
    environment:
      EUREKA_URL: http://name-server:8761/eureka
      POSTGRES_URL: jdbc:postgresql://postgres:5432/memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RETRIEVAL_URL: lb://retrieval-service
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      name-server: { condition: service_started }
    restart: unless-stopped

  agent-service:
    build: ./agent-service
    container_name: agent-service
    environment:
      EUREKA_URL: http://name-server:8761/eureka
      LLM_BASE_URL: http://llm-gateway:4000
      RABBITMQ_HOST: rabbitmq
      MEMORY_URL: lb://memory-service
      RETRIEVAL_URL: lb://retrieval-service
      TOOLS_URL: lb://tool-registry
    ports: ["8081:8081"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      llm-gateway: { condition: service_started }
      name-server: { condition: service_started }
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      EUREKA_URL: http://name-server:8761/eureka
      REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      name-server: { condition: service_started }
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  chroma-data:
  rabbitmq-data:
  ollama-models:
